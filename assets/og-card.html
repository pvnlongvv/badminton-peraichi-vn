<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<!-- Nguồn render ảnh Open Graph (1200x630). Render bằng headless Chrome — xem README. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800;900&family=Be+Vietnam+Pro:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body { font-family: 'Be Vietnam Pro', system-ui, sans-serif; position: relative; }
  .photo { position: absolute; inset: 0; width: 1200px; height: 630px;
    object-fit: cover; object-position: center 42%; }
  /* Lớp phủ giúp chữ nổi rõ */
  .scrim { position: absolute; inset: 0;
    background:
      linear-gradient(90deg, rgba(8,28,40,0.92) 0%, rgba(8,28,40,0.70) 42%, rgba(8,28,40,0.10) 70%, rgba(8,28,40,0) 100%),
      linear-gradient(0deg, rgba(8,28,40,0.85) 0%, rgba(8,28,40,0) 38%); }
  .content { position: absolute; inset: 0; z-index: 2; display: flex; flex-direction: column;
    justify-content: space-between; padding: 52px 60px; }
  .badge { align-self: flex-start; display: inline-flex; align-items: center; gap: 12px;
    background: #00a4dc; color: #fff; border-radius: 999px; padding: 12px 26px;
    font-family: 'M PLUS Rounded 1c'; font-weight: 800; font-size: 23px; letter-spacing: 0.01em;
    box-shadow: 0 10px 28px -8px rgba(0,0,0,0.45); }
  .badge .dot { width: 13px; height: 13px; background: #ffd60a; border-radius: 50%; }
  .bottom { max-width: 760px; }
  h1 { font-family: 'M PLUS Rounded 1c'; font-weight: 900; font-size: 62px; line-height: 1.1;
    color: #fff; letter-spacing: -0.01em; text-shadow: 0 4px 18px rgba(0,0,0,0.45); margin-bottom: 18px; }
  h1 .accent { color: #4fd1f5; white-space: nowrap; }
  h1 .hl { background: linear-gradient(transparent 58%, #ffc107 58%); color: #2c3e50; padding: 0 8px; white-space: nowrap; }
  .sub { font-size: 27px; color: #eaf6fc; font-weight: 600; line-height: 1.4;
    text-shadow: 0 2px 10px rgba(0,0,0,0.55); margin-bottom: 22px; }
  .pills { display: flex; gap: 13px; flex-wrap: wrap; }
  .pill { background: rgba(255,255,255,0.95); border-radius: 999px; padding: 11px 22px;
    font-family: 'M PLUS Rounded 1c'; font-weight: 800; font-size: 22px; color: #0080b3;
    display: inline-flex; align-items: center; gap: 9px; box-shadow: 0 8px 20px -10px rgba(0,0,0,0.5); }
  .pill .n { color: #e63946; }
</style>
</head>
<body>
  <img class="photo" src="hero.jpg" alt="">
  <div class="scrim"></div>
  <div class="content">
    <div class="badge"><span class="dot"></span>PERAICHI BADMINTON CUP 2026</div>
    <div class="bottom">
      <h1>Luật <span class="accent">Cầu lông</span> Đôi <span class="hl">Nam Nữ</span></h1>
      <div class="sub">Giải cầu lông đôi nam nữ nội bộ Peraichi Việt Nam — luật chơi &amp; thể thức.</div>
      <div class="pills">
        <span class="pill"><span class="n">7</span> đội</span>
        <span class="pill"><span class="n">2</span> bảng đấu</span>
        <span class="pill">🏸 Play-off tranh giải</span>
      </div>
    </div>
  </div>
</body>
</html>
