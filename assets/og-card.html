<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<!-- Nguồn để render ảnh Open Graph (1200x630). Tạo lại bằng: npm-less, dùng headless Chrome — xem README/scripts. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800;900&family=Be+Vietnam+Pro:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: 'Be Vietnam Pro', system-ui, sans-serif;
    background: linear-gradient(135deg, #e6f6fc 0%, #fff4d6 100%);
    position: relative;
  }
  .blob1 { position: absolute; top: -160px; right: -120px; width: 520px; height: 520px;
    background: radial-gradient(circle, rgba(0,164,220,0.18), transparent 65%); border-radius: 50%; }
  .blob2 { position: absolute; bottom: -180px; left: -100px; width: 460px; height: 460px;
    background: radial-gradient(circle, rgba(255,193,7,0.22), transparent 65%); border-radius: 50%; }
  .wrap { position: relative; z-index: 2; display: grid; grid-template-columns: 1.25fr 1fr;
    height: 100%; align-items: center; padding: 64px 70px; gap: 40px; }
  .badge { display: inline-flex; align-items: center; gap: 12px; background: #fff;
    border-radius: 999px; padding: 12px 26px; font-family: 'M PLUS Rounded 1c'; font-weight: 800;
    font-size: 22px; color: #0080b3; box-shadow: 0 8px 24px -8px rgba(0,164,220,0.35); margin-bottom: 28px; }
  .badge .dot { width: 14px; height: 14px; background: #ff5a5f; border-radius: 50%; }
  h1 { font-family: 'M PLUS Rounded 1c'; font-weight: 900; font-size: 58px; line-height: 1.12;
    color: #2c3e50; letter-spacing: -0.01em; margin-bottom: 24px; }
  h1 .accent { color: #00a4dc; white-space: nowrap; }
  h1 .hl { background: linear-gradient(transparent 60%, #ffc107 60%); padding: 0 6px; white-space: nowrap; }
  .sub { font-size: 26px; color: #546070; font-weight: 500; line-height: 1.45; margin-bottom: 30px; max-width: 640px; }
  .pills { display: flex; gap: 14px; flex-wrap: wrap; }
  .pill { background: #fff; border-radius: 999px; padding: 12px 22px; font-family: 'M PLUS Rounded 1c';
    font-weight: 800; font-size: 23px; color: #0080b3; box-shadow: 0 6px 18px -8px rgba(0,80,120,0.25);
    display: inline-flex; align-items: center; gap: 10px; }
  .pill .n { color: #e63946; }
  .court-card { background: #fff; border-radius: 28px; padding: 26px; box-shadow: 0 30px 60px -20px rgba(0,80,120,0.3);
    position: relative; }
  .court-tag { position: absolute; top: 18px; right: 18px; background: #ffc107; color: #2c3e50;
    border-radius: 999px; padding: 8px 18px; font-family: 'M PLUS Rounded 1c'; font-weight: 900; font-size: 18px; }
  .court-bg { background: #f0faff; border-radius: 18px; padding: 16px; }
  svg { width: 100%; height: auto; display: block; }
  .url { margin-top: 30px; font-family: 'M PLUS Rounded 1c';
    font-weight: 700; font-size: 20px; color: #0080b3; opacity: 0.85; }
</style>
</head>
<body>
  <div class="blob1"></div>
  <div class="blob2"></div>
  <div class="wrap">
    <div>
      <div class="badge"><span class="dot"></span>PERAICHI BADMINTON CUP 2026</div>
      <h1>Luật chơi <span class="accent">Cầu lông</span><br>Đôi <span class="hl">Nam Nữ</span></h1>
      <div class="sub">Giải cầu lông đôi nam nữ nội bộ Peraichi Việt Nam — luật chơi & thể thức cho người mới.</div>
      <div class="pills">
        <span class="pill"><span class="n">7</span> đội</span>
        <span class="pill"><span class="n">2</span> bảng đấu</span>
        <span class="pill">🏸 Play-off tranh giải</span>
      </div>
      <div class="url">pvnlongvv.github.io/badminton-peraichi-vn</div>
    </div>
    <div class="court-card">
      <div class="court-tag">🏸 SÂN ĐÔI</div>
      <div class="court-bg">
        <svg viewBox="0 0 400 420" preserveAspectRatio="xMidYMid meet">
          <rect width="400" height="420" fill="#0f2c20" rx="12" />
          <rect x="50" y="40" width="300" height="340" fill="#1b4332" />
          <rect x="50" y="40" width="300" height="170" fill="#2d6a4f" opacity="0.4" />
          <rect x="50" y="40" width="300" height="340" fill="none" stroke="rgba(255,255,255,0.85)" stroke-width="2.5" />
          <line x1="73" y1="40" x2="73" y2="380" stroke="rgba(255,255,255,0.85)" stroke-width="1.5" />
          <line x1="327" y1="40" x2="327" y2="380" stroke="rgba(255,255,255,0.85)" stroke-width="1.5" />
          <line x1="50" y1="60" x2="350" y2="60" stroke="rgba(255,255,255,0.85)" stroke-width="1.5" />
          <line x1="50" y1="360" x2="350" y2="360" stroke="rgba(255,255,255,0.85)" stroke-width="1.5" />
          <line x1="50" y1="160" x2="350" y2="160" stroke="rgba(255,255,255,0.85)" stroke-width="1.5" />
          <line x1="50" y1="260" x2="350" y2="260" stroke="rgba(255,255,255,0.85)" stroke-width="1.5" />
          <line x1="200" y1="40" x2="200" y2="160" stroke="rgba(255,255,255,0.85)" stroke-width="1.5" />
          <line x1="200" y1="260" x2="200" y2="380" stroke="rgba(255,255,255,0.85)" stroke-width="1.5" />
          <line x1="50" y1="210" x2="350" y2="210" stroke="#ffd60a" stroke-width="2.5" stroke-dasharray="4,3" opacity="0.9" />
          <circle cx="125" cy="100" r="11" fill="#ffd60a" stroke="#0f2c20" stroke-width="2" />
          <circle cx="275" cy="100" r="11" fill="#ffd60a" stroke="#0f2c20" stroke-width="2" />
          <circle cx="125" cy="320" r="11" fill="#ff5a5f" stroke="#0f2c20" stroke-width="2" />
          <circle cx="275" cy="320" r="11" fill="#ff5a5f" stroke="#0f2c20" stroke-width="2" />
        </svg>
      </div>
    </div>
  </div>
</body>
</html>
